<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Arepas</title>
    <link rel="icon" type="image/svg+xml" href="ArepasHyM.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
    <div class="container">
        <h1>🫓 Cuentas de Arepas</h1>
        
        <div class="input-group">
            <label>Grande ($5.300)</label>
            <input type="number" id="grande" min="0" placeholder="0">
        </div>

        <div class="input-group">
            <label>Mediana ($3.300)</label>
            <input type="number" id="mediana" min="0" placeholder="0">
        </div>

        <div class="input-group">
            <label>Pequeña ($3.800)</label>
            <input type="number" id="pequena" min="0" placeholder="0">
        </div>

        <button onclick="calcularTotal()">Calcular Total</button>

        <div id="resultado" class="result">
            Total a pagar: $0
        </div>
    </div>
    
</body>
</html>
